# =============================================================================
# Cluster Spark + Airflow + FastAPI + Nginx  —  MacBook M2 16 GB
#
# ORÇAMENTO DE MEMÓRIA (limite: 14 GB, ~2 GB livres para o macOS)
# ─────────────────────────────────────────────────────────────────
# Grupo Spark      : 6.88 GB
#   spark-master         512 M  — só coordenação; nunca executa tasks
#   spark-worker-1/2/3     2 G  — reduzido de 3 G: jobs de teste não são
#                                 contínuos; pode subir sob demanda
#   spark-history-server 384 M  — leitura de event-logs; I/O bound
#
# Grupo Suporte    : 2.87 GB
#   postgres             256 M  — banco de metadados pequeno
#   airflow-init         256 M  — executa UMA vez e encerra (transiente)
#   airflow-webserver      1 G  — Flask + gunicorn multi-worker
#   airflow-scheduler      1 G  — heartbeat + parsing de DAGs
#   fastapi              512 M  — API leve de leitura (gold layer)
#   nginx                128 M  — proxy reverso: CPU/memória triviais
#
# Total operacional       : ~9.75 GB
# React (profiles:build)  : +512 M somente sob demanda
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost/airflow
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    # Conexão usada pelo SparkSubmitOperator
    AIRFLOW_CONN_SPARK_DEFAULT: >-
      {"conn_type": "spark", "host": "spark-master", "port": 7077,
       "extra": {"deploy_mode": "client", "spark_home": "/opt/spark"}}
    SPARK_MASTER: spark://spark-master:7077
    # AWS — necessário para que spark-submit herde as credenciais
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    # Credenciais do usuário admin (usadas apenas pelo airflow-init)
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./spark_scripts:/opt/airflow/spark_scripts
  networks:
    - spark-net

services:

  # ── Spark Cluster ─────────────────────────────────────────────────────────

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-logs:/opt/spark/logs
      - spark-ivy-cache:/opt/spark/ivy-cache
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 512M

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - "8081:8081"
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-logs:/opt/spark/logs
      - spark-ivy-cache:/opt/spark/ivy-cache
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 2G

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - "8082:8081"
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-logs:/opt/spark/logs
      - spark-ivy-cache:/opt/spark/ivy-cache
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 2G

  spark-worker-3:
    image: apache/spark:3.5.3
    container_name: spark-worker-3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    ports:
      - "8083:8081"
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-logs:/opt/spark/logs
      - spark-ivy-cache:/opt/spark/ivy-cache
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 2G

  spark-history-server:
    image: apache/spark:3.5.3
    container_name: spark-history-server
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    depends_on:
      - spark-master
    ports:
      - "18080:18080"
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-logs:/opt/spark/logs
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Banco de metadados ────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spark-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Airflow ───────────────────────────────────────────────────────────────

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # Inicializa o banco e cria o usuário admin; encerra após concluir.
    # || true evita falha caso o usuário já exista numa re-execução.
    command:
      - bash
      - -c
      - "airflow db migrate && (airflow users create --username $$_AIRFLOW_WWW_USER_USERNAME --firstname Admin --lastname User --role Admin --email admin@example.com --password $$_AIRFLOW_WWW_USER_PASSWORD || true)"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8090:8080"   # acesso direto; rota principal via nginx /airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./jobs:/opt/airflow/jobs
      - ./spark_scripts:/opt/airflow/spark_scripts
      - ./dbt_project:/opt/airflow/dbt_project
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-ivy-cache:/opt/spark/ivy-cache
      - spark-logs:/opt/spark/logs
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1.5G

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: bash -c "chmod -R 777 /opt/spark/ivy-cache ; exec airflow scheduler"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./jobs:/opt/airflow/jobs
      - ./data:/opt/spark/work-dir/data
      - ./spark_scripts:/opt/airflow/spark_scripts
      - ./dbt_project:/opt/airflow/dbt_project
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/log4j2.properties:/opt/spark/conf/log4j2.properties
      - spark-ivy-cache:/opt/spark/ivy-cache
      - spark-logs:/opt/spark/logs
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G

  # ── FastAPI ───────────────────────────────────────────────────────────────

  fastapi:
    build:
      context: ./fastapi_app
    container_name: fastapi
    volumes:
      - ./data/gold:/data/gold:ro
    networks:
      - spark-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx (proxy reverso) ─────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - react-dist:/usr/share/nginx/html:ro
    networks:
      - spark-net
    depends_on:
      - airflow-webserver
      - fastapi
    deploy:
      resources:
        limits:
          memory: 128M

  # ── dbt docs (sob demanda) ───────────────────────────────────────────────

  dbt-docs:
    image: python:3.11-slim
    container_name: dbt-docs
    working_dir: /dbt_project
    command:
      - bash
      - -c
      - "pip install --no-cache-dir dbt-core dbt-spark && dbt docs generate && dbt docs serve --host 0.0.0.0 --port 8085"
    volumes:
      - ./dbt_project:/dbt_project
    ports:
      - "8085:8085"
    networks:
      - spark-net
    profiles:
      - dbt
    deploy:
      resources:
        limits:
          memory: 512M

  # ── React (build estático — sob demanda) ──────────────────────────────────

  react:
    build:
      context: ./react_app
    container_name: react-build
    # Gera o dist e encerra; nginx serve os arquivos via volume react-dist.
    # Executar com: docker compose --profile build up react
    volumes:
      - react-dist:/app/dist
    networks:
      - spark-net
    profiles:
      - build
    deploy:
      resources:
        limits:
          memory: 512M

# ── Rede ──────────────────────────────────────────────────────────────────

networks:
  spark-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────

volumes:
  spark-logs:
  spark-ivy-cache:
  postgres-data:
  react-dist:
