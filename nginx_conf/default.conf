upstream airflow_upstream {
    server airflow-webserver:8080;
}

upstream fastapi_upstream {
    server fastapi:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # ── React SPA ────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # ── Airflow  →  airflow-webserver:8080/airflow/ ──────────────────────────
    # AIRFLOW__WEBSERVER__BASE_URL deve ser http://localhost/airflow
    # AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX deve ser True
    location /airflow/ {
        proxy_pass http://airflow_upstream/airflow/;
        proxy_http_version 1.1;

        # Suporte a WebSocket (auto-refresh do Airflow)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect   off;
        proxy_read_timeout 90s;
    }

    # ── FastAPI  →  fastapi:8000  (strip /api prefix) ────────────────────────
    # FastAPI recebe as rotas a partir de /; ex.: GET /api/items → GET /items
    location /api/ {
        proxy_pass http://fastapi_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
    }
}
