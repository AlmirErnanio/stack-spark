spark.eventLog.enabled          true
spark.eventLog.dir              /opt/spark/logs
spark.history.fs.logDirectory   /opt/spark/logs
spark.history.ui.port           18080

# ── S3A — JARs (hadoop-aws + SDK, baixados via Maven na 1ª execução) ─────────
# Spark 3.5.3 usa Hadoop 3.3.4 internamente; versões devem ser compatíveis.
spark.jars.packages             org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
spark.jars.ivy                  /opt/spark/ivy-cache

# ── S3A — FileSystem e credenciais ───────────────────────────────────────────
spark.hadoop.fs.s3a.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider        com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          true

# ── S3A — Performance ─────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.fast.upload                     true
spark.hadoop.fs.s3a.fast.upload.buffer              disk
spark.hadoop.fs.s3a.multipart.size                  134217728
spark.hadoop.fs.s3a.connection.maximum              100
spark.hadoop.fs.s3a.threads.max                     20
