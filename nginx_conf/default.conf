# 127.0.0.11 = DNS interno do Docker; re-resolve hostnames após restarts de containers
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # ── React SPA ────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # ── Airflow  →  airflow-webserver:8080/airflow/ ──────────────────────────
    # AIRFLOW__WEBSERVER__BASE_URL deve ser http://localhost/airflow
    # AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX deve ser True
    location /airflow/ {
        set $airflow_upstream http://airflow-webserver:8080;
        proxy_pass $airflow_upstream;
        proxy_http_version 1.1;

        # Suporte a WebSocket (auto-refresh do Airflow)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect   off;
        proxy_read_timeout 90s;
    }

    # ── FastAPI  →  fastapi:8000  (strip /api prefix) ────────────────────────
    # FastAPI recebe as rotas a partir de /; ex.: GET /api/items → GET /items
    location /api/ {
        set $fastapi_upstream http://fastapi:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
    }
}
